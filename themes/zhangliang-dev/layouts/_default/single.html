{{ define "main" }}
<style>
  .page { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
  .page-title {
    font-size: 40px; font-weight: 600; line-height: 1.10;
    letter-spacing: -1.5px; margin-bottom: 32px;
  }
  .page-divider { border: none; border-top: 1px solid #171717; margin: 0 0 48px; }
  .page-body { font-size: 16px; line-height: 1.80; color: var(--color-text-secondary); }
  .page-body h2 { font-size: 28px; font-weight: 600; color: var(--color-text); margin: 40px 0 16px; }
  .page-body h3 { font-size: 22px; font-weight: 600; color: var(--color-text); margin: 32px 0 12px; }
  .page-body p { margin-bottom: 20px; }
  .page-body ul, .page-body ol { margin-bottom: 20px; padding-left: 24px; }
  .page-body li { margin-bottom: 8px; }
  .page-body a { color: var(--color-accent); }
</style>

<article class="page">
  <h1 class="page-title">{{ .Title }}</h1>
  <hr class="page-divider">
  <div class="page-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
