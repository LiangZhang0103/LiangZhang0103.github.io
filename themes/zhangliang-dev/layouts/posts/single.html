{{ define "main" }}
<style>
  .post { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
  .post-back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--color-text-muted); font-family: 'Geist Mono', monospace;
    margin-bottom: 32px;
  }
  .post-back:hover { color: var(--color-accent); text-decoration: none; }
  .post-header { margin-bottom: 48px; }
  .post-meta {
    font-size: 13px; color: var(--color-text-muted);
    font-family: 'Geist Mono', monospace; margin-bottom: 16px;
  }
  .post-title {
    font-size: 40px; font-weight: 600; line-height: 1.10;
    letter-spacing: -1.5px; margin-bottom: 16px;
  }
  .post-tags { display: flex; gap: 8px; margin-top: 12px; }
  .post-tag {
    background: #ebf5ff; color: #0068d6;
    padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500;
    font-family: 'Geist Mono', monospace;
  }
  .post-divider { border: none; border-top: 1px solid #171717; margin: 0 0 48px; }
  .post-body { font-size: 16px; line-height: 1.80; color: var(--color-text-secondary); }
  .post-body h1, .post-body h2, .post-body h3, .post-body h4 {
    color: var(--color-text); font-weight: 600; margin: 48px 0 16px;
    letter-spacing: -0.5px;
  }
  .post-body h2 { font-size: 28px; }
  .post-body h3 { font-size: 22px; }
  .post-body p { margin-bottom: 20px; }
  .post-body ul, .post-body ol { margin-bottom: 20px; padding-left: 24px; }
  .post-body li { margin-bottom: 8px; }
  .post-body blockquote {
    border-left: 3px solid var(--color-accent); padding: 12px 20px;
    background: var(--color-surface); border-radius: 0 6px 6px 0;
    margin-bottom: 20px;
  }
  .post-body img { border-radius: 8px; margin: 24px 0; }
  .post-body a { color: var(--color-accent); text-decoration: underline; text-underline-offset: 2px; }
  .post-body table { width: 100%; border-collapse: collapse; margin: 24px 0; }
  .post-body th, .post-body td { border: 1px solid var(--color-border); padding: 10px 14px; text-align: left; font-size: 14px; }
  .post-body th { background: var(--color-surface); font-weight: 600; color: var(--color-text); }

  @media (max-width: 768px) {
    .post-title { font-size: 28px; letter-spacing: -1px; }
    .post { padding: 40px 24px; }
  }
</style>

<article class="post">
  <a href="/posts/" class="post-back">← 返回文章列表</a>
  <div class="post-header">
    <div class="post-meta">{{ .Date.Format "2006-01-02" }} · {{ .ReadingTime }} min read</div>
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-tags">
      {{ range .Params.tags }}
      <span class="post-tag">{{ . }}</span>
      {{ end }}
    </div>
  </div>
  <hr class="post-divider">
  <div class="post-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
