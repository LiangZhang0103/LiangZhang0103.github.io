{{ define "main" }}
<style>
  .not-found {
    max-width: 720px; margin: 0 auto; padding: 64px 24px;
    min-height: 60vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
  }
  .not-found-code {
    font-size: 120px; font-weight: 700; letter-spacing: -4px;
    color: var(--color-text); line-height: 1; margin-bottom: 16px;
    font-family: 'Geist Mono', monospace;
  }
  .not-found-msg {
    font-size: 18px; color: var(--color-text-secondary);
    margin-bottom: 40px; font-weight: 400;
  }
  .not-found-links {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .not-found-links a {
    background: var(--color-accent); color: #fff;
    padding: 10px 24px; border-radius: 64px; font-size: 14px; font-weight: 500;
    text-decoration: none; transition: opacity 0.15s;
  }
  .not-found-links a:hover { opacity: 0.85; }
  .not-found-links a.secondary {
    background: transparent; color: var(--color-text);
    border: 1px solid var(--color-border); padding: 10px 24px;
  }
  .not-found-links a.secondary:hover { background: var(--color-surface); }
</style>

<section class="not-found">
  <div class="not-found-code">404</div>
  <p class="not-found-msg">页面不存在，可能已被移动或删除</p>
  <div class="not-found-links">
    <a href="/">返回首页</a>
    <a href="/posts/" class="secondary">浏览文章</a>
  </div>
</section>
{{ end }}
